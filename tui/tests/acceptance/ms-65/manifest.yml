#     meant, it needs a contract amendment.
#
# 17. **Per-tab sub-state persistence is asserted by NOBODY.** §6's last bullet
#     pins that the sub-tab selection is persisted ("as a string — yes") while
#     scroll offsets may be dropped, but §6's pinned JSON shape carries no
#     field for it: a document key is `{"repo": …, "issue": …}` and nothing
