# 17. **§4's bare `Ctrl-W` and §9's `Ctrl-W <key>` leader chords COLLIDE on the
#     same prefix, and the contract never says how they coexist.** §4 pins
#     "`Ctrl-W` closes the active tab and activates a defined neighbour" — a
#     shipped #2283 clause with its own sealed ids
#     (`ctrl_w_closes_the_active_tab_and_activates_its_left_neighbour`,
#     `ctrl_w_on_the_leftmost_tab_activates_the_new_leftmost`). §9's key table
#     then pins `Ctrl-W v` / `Ctrl-W s` / `Ctrl-W w` / `Ctrl-W x` as pane
#     chords "following this app's existing `Ctrl-W`-as-pane-leader convention
#     already shipped for the Terminal panel". The two readings are mutually
#     exclusive as stated:
#
#       (a) If `Ctrl-W` closes immediately, it swallows §9's chords — measured:
#           `closing_the_last_remaining_pane_is_a_no_op` observed the shipped
#           app close `#102` on the `Ctrl-W` and drop the `x`, which is exactly
#           the failure mode a worker will hit first.
#       (b) If `Ctrl-W` enters a pending-leader state, §4's close is delayed
#           until the next keystroke, which #2283's two ids may or may not
#           tolerate depending on how they were written (this slice has not
#           read them).
#
#     A third reading — pending-leader, and any key that is NOT one of
#     `v`/`s`/`w`/`x` falls through to §4's close plus that key — satisfies
#     both sections, but the contract does not name it and a worker should not
#     have to invent it. **This is a Gate-A amendment, not a worker decision.**
#     This slice sends §9's chords as written and asserts §9's outcomes; it
#     deliberately does NOT re-assert §4's bare-`Ctrl-W` behaviour (that is
#     #2283's slice's subject, and taking a side here would pin one of the two
#     readings). Flagged as a `TODO(test-author)` in the slice too.
