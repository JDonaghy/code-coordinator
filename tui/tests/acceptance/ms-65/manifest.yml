# Acceptance manifest for milestone ms-65 ("coord-tui: per-panel document tabs
# (preview/pin)", tracking issue #2289). Maps each acceptance test-id -> the
# work-order issue it covers.
#
# Driver: tui-tuidriver (coordinator.yml `acceptance.drivers`, route `tui/**`)
#   cd tui && cargo test --test acceptance -- --format json
#
# Test-ids are the libtest `name` emitted by `cargo test --test acceptance`
# (module-qualified fn path). The slice files live in this directory and are
# `include!`d at crate root by `tui/tests/acceptance.rs`.
#
# Merged (never clobbered) across issues by coord.acceptance.load_manifest —
# #2283 / #2284 / #2285 / #2286 / #2287 / #2288 append their own entries here
# when their slices are authored just-in-time. #2281 has no UI surface of its
# own (contract §7) and therefore no slice; it is exercised by every test below
# running at all, since `make_app_with_board_json` is what seeds their fixture.

tests:
  # ── #2282 (W-1) — Board panel document tab strip (contract §2) ───────────
  # Slice: board_tabs_2282.rs · mocks: board-baseline-no-tabs.screen,
  # board-preview-tab.screen, board-pinned-3-tabs.screen
  #
  # §2a — zero tabs render no strip (the regression bar; also §4's empty-state
  # target and §8a's absent-hint reference). THIS IS THE GREEN CONTROL — see
  # the `expected_red` block below.
  board_tabs_2282::zero_doc_tabs_render_no_tab_strip: 2282
  # §2a — with >=1 tab the strip sits between the toolbar and the sub-tab bar,
  # and carries a `#<N>` substring
  board_tabs_2282::doc_tab_strip_renders_between_the_toolbar_and_the_subtab_bar: 2282
  # §2a — the `Board / Issue / Chat / Terminal` sub-tab bar renders regardless
  # of tab state, and the strip never displaces it upward
  board_tabs_2282::subtab_bar_renders_regardless_of_doc_tab_state: 2282
  # §2b + §1 — preview label `∘ #<N> <title>` truncated at 22 columns
  board_tabs_2282::preview_tab_label_is_the_issue_number_and_title_truncated_to_22_columns: 2282
  # §2b — pinned labels `#<N> <title>` truncated at 20 columns, no `∘ ` marker
  board_tabs_2282::pinned_tab_labels_are_truncated_to_20_columns: 2282
  # §2c — the active tab is bracketed `[<label> ×]`, inactive tabs are not
  board_tabs_2282::active_tab_is_bracketed_and_inactive_tabs_are_not: 2282
  # §2d — every open closable tab carries the trailing `×` (TAB_CLOSE_CHAR)
  board_tabs_2282::every_open_tab_renders_the_close_glyph: 2282
  # §2e rule 1 (append branch) — one single click opens one preview tab
  board_tabs_2282::single_click_opens_one_preview_tab: 2282
  # §2e rule 1 (replace branch) + rule 4 — a second single click replaces the
  # preview in place; count stays 1
  board_tabs_2282::second_single_click_replaces_the_preview_tab_in_place: 2282
  # §2e rule 2 — single-clicking an already-open row activates it, adds nothing
  board_tabs_2282::single_click_on_an_already_open_row_activates_it_without_adding_a_tab: 2282
  # §2e rule 3 — a double click pins the tab and drops the `∘ ` marker
  board_tabs_2282::double_click_pins_the_tab_and_drops_the_preview_marker: 2282
  # §2e — the 2-tab intermediate state the contract explicitly warns not to
  # confuse with the 3-double-click sequence (pinned #101 + preview #102)
  board_tabs_2282::a_pinned_tab_plus_a_single_click_yields_two_tabs_one_of_them_preview: 2282
  # §2e — the headline end state of mocks/board-pinned-3-tabs.screen
  board_tabs_2282::three_double_clicks_yield_three_pinned_tabs_with_the_last_active: 2282
  # §2f (half one) — activating a tab selects the matching sidebar row (`▸`)
  board_tabs_2282::activating_a_tab_selects_its_sidebar_row: 2282
  # §2f (half two) — …and SCROLLS it into view. See the quadraui#595 note below.
  board_tabs_2282::activating_a_tab_scrolls_its_sidebar_row_into_view: 2282

