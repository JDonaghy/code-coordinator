# 14. **A REAL CONSTRAINT ON #2286's IMPLEMENTATION, discovered while making §6
#     observable: the restore must run on the FIXTURE construction path, and
#     the coord-dir has no injectable seam.** Two facts force this:
#
#       (a) The sealed suite's only way to build an app is #2281's
#           `make_app_with_board_json` → `make_test_app`, which today sets
#           `doc_tabs: DocTabs::default()` outright. `CoordApp::new()` is
#           public but builds the real daemon-backed app with an EMPTY board,
#           against which every persisted document would be pruned on load
#           (§6: "drop any document whose issue is absent from the board") — so
#           it structurally cannot witness a restore. If the load is wired only
#           into real startup, the five restore/prune ids above stay red no
#           matter how correct `doc_tabs.rs` is.
#
#       (b) Every `~/.coord/…` path resolves through `std::env::var_os("HOME")`
#           (`TuiSettings::path`, `Workspace::path`, `app::data::coord_dir`).
#           There is no `COORD_HOME`-style override, so this slice sandboxes
#           `HOME` to a temp dir (serialised behind a slice-global mutex,
#           restored on drop including on panic) rather than clobbering the
#           developer's real `~/.coord/tabs.json`. That window is
#           process-global: while it is held, concurrently-running tests from
#           OTHER slices see the sandboxed `HOME` too. Measured at authoring
#           time it changes nothing — a `--skip tabs_persistence_2286` baseline
#           reproduces exactly the same 6 pre-existing failures — but it is a
#           latent cross-slice coupling, and it will get worse: once (a) lands,
#           EVERY ms-65 slice's zero-tab control (`zero_doc_tabs_render_no_tab_strip`,
#           `pipeline_with_zero_doc_tabs_renders_no_tab_strip`,
#           `zero_tabs_render_no_close_or_overflow_glyphs`) will start reading
#           the developer's REAL `~/.coord/tabs.json` and go red on any machine
#           where a human has used the shipped feature.
#
#     Both halves point at the same cheap fix, which is a coordinator call, not
#     a worker's: give the coord-dir an injectable seam under
#     `#[cfg(any(test, feature = "test-support"))]` (the exact widening this
#     repo already applied to `resolve_board_service()` for #1039, and that
#     finding 7 asks for on `start_data_load()`), and have the fixture path
#     restore through it. Absent that, either the restore is untestable or the
#     rest of ms-65's suite becomes machine-dependent.
#
# 15. Entering the Pipeline panel — finding 7's fixture-wipe blocker — did NOT
#     bite this slice at authoring time, and the reason is worth recording:
#     under the sandboxed `HOME` there is no `~/.coord/coord.db` to load, so
#     `start_data_load` has nothing to overwrite the seeded board with.
#     `pipeline_tabs_are_restored_to_the_pipeline_panel_with_its_own_active_tab`
#     got cleanly past its `Overview` precondition and failed on its §6 clause
#     on every run. That is a side effect of the sandbox, not a fix: finding 7
#     stands for every other slice, and if #2286's worker moves the tab load
#     off the `HOME` seam the protection disappears with it.
#
# 16. §6 bullet 3 says "a surviving neighbour in `tabs` (order preserved)
#     becomes active" without pinning WHICH neighbour. §4 pins a left-neighbour
#     rule, but that is #2283's `Ctrl-W` close gesture, and §6 does not extend
