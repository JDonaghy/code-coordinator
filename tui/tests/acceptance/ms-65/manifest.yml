# ═══════════════════════════════════════════════════════════════════════════
# FOR THE COORDINATOR — three findings from authoring this slice. None of them
# is a worker's to fix, and none was resolved by editing the contract (a
# test-author may not amend one; #2289 also forbids amending it mid-drive).
# ═══════════════════════════════════════════════════════════════════════════
#
# 1. §2a's `driver.screen_contains("[Board]")` is FALSE against the shipped
#    app, and §2a itself calls the sub-tab bar "unchanged by this milestone".
#    The shipped bar renders `Board  Issue  Board Chat  Terminal`: quadraui's
#    `draw_tab_bar` marks the active tab with colour, not brackets, and
#    coord-tui's labels are `" Board "` / `" Issue "` / `" Board Chat "` /
#    `" Terminal "` (`tui/src/app/render.rs`). The mocks' `[Board]` and the
#    mocks' `Chat` (vs. the shipped `Board Chat`) are both mock artifacts.
#    This slice locates the bar by its real labels instead. §2c's `[<label> ×]`
#    bracket on the *doc*-tab strip is untouched by this: the contract calls
#    that "a new, milestone-local convention", i.e. genuinely #2282's job, and
#    it IS asserted literally.
#
# 2. §2a's "with zero doc tabs open, the row immediately below the toolbar row
#    IS the `Board / Issue / Chat / Terminal` row" is false of §2a's own
#    reference mock (in `mocks/board-baseline-no-tabs.screen` row 1 is blank
#    and the sub-tab bar is row 2) and of the shipped app (row 1 is the
#    `[ ↻ Sync (S) ]` button row). What the prose and both mocks DO agree on is
#    the ordering, so that is what is asserted. If the literal row-index claim
#    was meant, it needs a contract amendment — asserting it as written would
#    be red against a correct implementation.
#
# 3. §2f's scroll half is blocked on milestone pre-requisite quadraui#595
#    (`SidebarSystem::reveal`), which is NOT landed at the currently pinned
#    quadraui rev (`d70da7dff7ef9f1eb578ee48aca69297e548348e`). Measured, not
#    assumed: on a 120×11 grid with contract §7's five issues, neither wheel
#    `UiEvent::Scroll` nor arrow-key selection moves the Board sidebar list —
#    arrowing down to #105 updates the detail pane while the list keeps showing
#    #101–#103. `activating_a_tab_scrolls_its_sidebar_row_into_view` will stay
#    red until the pin bump named in #2289's pre-requisite table lands, however
#    complete #2282's own code is. Its setup reaches #105 through the sidebar
#    FILTER box rather than by scrolling, so every step before the two final
#    asserts is a harness precondition and says "NOT a #2282 defect" in its
#    panic message.
#
# Also worth knowing, not a contract problem: the mocks draw sidebar rows as
# `#102 Auth token refresh bug`; the shipped sidebar renders
# `      #102  Auth token refresh b` (two spaces, title truncated to the
# 35-column sidebar). The slice's `ROW_*` click targets are taken from a real
# render for that reason. `TuiDriver` at the pinned rev has neither
# `double_click()` (quadraui#592) nor styled-cell reads (quadraui#593); the
# slice works around the first by dispatching the `MouseDown`+`UiEvent::DoubleClick`
# pair the real runner's `DoubleClickDetector` produces (deterministic, no
# 400 ms wall clock), and around the second via contract §1's `∘ ` marker plus
# `×`-counting, exactly as §2e instructs.

# ═══════════════════════════════════════════════════════════════════════════
# FOR THE COORDINATOR — findings from authoring the #2283 slice (contract §4).
# Independent of the #2282 notes above; again, none is a worker's to fix and
# none was resolved by editing the contract (a test-author may not amend one).
# ═══════════════════════════════════════════════════════════════════════════
#
# 4. `mocks/board-tabs-overflow.screen` CONTRADICTS §2b's pinned label width.
#    §2b pins 20 columns (22 with §1's `∘ ` marker) for the single-pane strip,
#    and `mocks/board-pinned-3-tabs.screen` renders exactly that
#    (`#101 Fix login race… ×`). §4's own mock renders a visibly narrower
#    label — `‹ #102 Auth… ×  #103 Race… ×  #104 Flak… ×  [#105 Memo… ×]`,
#    roughly 10 columns. The two cannot both be right, and the discrepancy is
#    load-bearing for that mock's headline claim: at the mock's own ~10-column
#    width all five tabs would fit the 82-column main panel and there would be
#    no overflow to depict, whereas at §2b's 20 columns only three fit
#    (measured against the shipped app, which already implements §2b's width:
#    `#103 Race condition… × #104 Flaky CI on ma… × [#105 Memory leak in… ×]`).
#    So the mock's "only 4 fit the strip width" is not reproducible under
#    either reading. This slice therefore asserts NEITHER the label width nor
#    the fitting count — only §4's own testable clauses (`‹` present / `›`
#    absent with #105 active, the mirror with #101 active, and "the active
#    tab's `#<N>` is always present regardless of scroll offset"), all of
#    which hold under both readings. If the 20/22 value is the intended one,
#    the overflow mock wants regenerating; if the mock is right, §2b wants
#    amending. Either way it is a Gate-A amendment, not a worker decision.
#
# 5. §4's "closing the last tab returns to `mocks/board-baseline-no-tabs.screen`'s
#    EXACT state" cannot be taken literally. That mock has `▸ #101` selected;
#    any scenario that opens a tab and closes it necessarily arrives with that
#    issue selected instead (§2f's reveal-on-activate selected it). A
#    full-frame comparison would be red against a correct implementation, so
#    `closing_the_last_tab_restores_the_zero_tab_baseline` asserts the parts
#    that ARE well defined — no `×`/`∘`/`‹`/`›` anywhere, and the sub-tab bar
#    back on the exact row it held before any tab was opened (i.e. the strip
#    reserved no row, §2a) — plus selection-follows-tree as a RELATION (the
#    detail pane's `claude-coordinator #<N>` header matches whichever sidebar
#    row is `▸`-marked) rather than by pinning which row that is. Flagged as a
#    `TODO(test-author)` in the slice too.
#
# 6. §4 pins the `Ctrl-Shift-Tab` CHORD but not its wire encoding, and the two
#    plausible ones differ: `Key::Named(Tab)` + `{ctrl, shift}`, or
#    `Key::Named(BackTab)` + `{ctrl, shift}` (crossterm folds Shift-Tab into
#    `KeyCode::BackTab`; quadraui's `tui::events` maps that to
#    `NamedKey::BackTab`). Pinning one would invent a detail the contract is
#    silent on, so the slice's `ctrl_shift_tab()` helper sends the `Tab` form
#    and, only if the STRIP ROW is unchanged, the `BackTab` form — either
#    satisfies the clause, handling neither still fails. (The fallback is
#    gated on the strip row, not the whole frame: an unhandled `Tab` chord
#    still repaints the sidebar focus ring, measured, which would otherwise
#    mask the fallback.)
#
# Also worth knowing, not a contract problem: the quadraui pin has MOVED since
# the #2282 slice was authored — `tui/Cargo.toml` now says
# `d6ae247c007721284dc895d4fbf42b5f4a5ba47f`, at which quadraui#592 and #594
# HAVE landed. `TuiDriver` now has real `double_click()`, `middle_click()`,
# `right_click()`, `click_with()`, `set_double_click_folding()` and
# `tab_close_center()`. This slice uses the first four and pins folding OFF so
# repeated clicks are never a wall-clock race. It deliberately does NOT use
# `tab_close_center()`, which needs the `WidgetId` the implementation gives the
# doc-tab bar — an implementation detail a sealed slice must not guess at; it
# resolves each tab's `×` from the rendered grid instead. Styled-cell reads
# (quadraui#593) have also landed (`style_at`/`styled_row`), but §1's ruling
# stands: the `∘ ` marker remains the pinned preview signal, and this slice
# asserts no styles.

# ═══════════════════════════════════════════════════════════════════════════
# FOR THE COORDINATOR — findings from authoring the #2284 slice (contract §3).
# Independent of the #2282 / #2283 notes above; again, none is a worker's to
# fix by editing this suite, and none was resolved by editing the contract.
# ═══════════════════════════════════════════════════════════════════════════
#
# 7. LIVE HARNESS BLOCKER (flaky, machine-dependent, and it will bite #2284's
#    worker on the very first run): **entering the Pipeline panel destroys the
#    seeded fixture in the sealed suite.** Switching panels runs
#    `sync_active_view_from_shell` -> `maybe_kick_pipeline_loader` ->
#    `refresh()` -> `start_data_load()` (`tui/src/app/data.rs:2620`). That
#    function short-circuits to `BoardData::default()` — so
#    `apply_pending_data`'s #620 degraded-tick guard keeps the seeded board —
#    but the short-circuit is gated `#[cfg(test)]` ONLY. `tui/tests/acceptance.rs`
#    is a separate integration-test crate, so the `coord_tui` it links is built
#    WITHOUT `cfg(test)`; the loader therefore reads the real local
#    `~/.coord/coord.db`, and the next dispatched event (`dispatch_handle`
#    drains the receiver before handling anything) wholesale-replaces
#    `self.data`. Measured on this machine: two clicks after landing on
#    Pipeline, the Board sidebar renders the developer's real `api (1)` repo
#    and the Pipeline tree is empty ("Loading tracked issues…").
#
#    It is a RACE, not a certainty — the load runs on a spawned thread, so
#    whether the fixture survives depends on whether that thread finished
#    before the next event. Across three authoring runs, 3 of the 5 red ids
#    died at the harness precondition and 2 got far enough to fail on the real
#    §3a clause; which is which varied run to run. Every affected assertion
#    says `HARNESS PRECONDITION (NOT a #2284 defect …)` in its panic message so
#    the two failure modes are distinguishable from a JSON report alone.
#
#    The fix is one line of app code, and this repo has already made it once
#    for the same reason: `resolve_board_service()`
#    (`tui/src/app/data.rs:1950`) is gated
#    `#[cfg(any(test, feature = "test-support"))]` with a comment citing #1039
#    and naming this exact external-crate `cfg(test)` trap.
#    `start_data_load()`'s stub needs the same widening. It is NOT in #2284's
#    "Files" list, so the coordinator should either land it as a prerequisite
#    or explicitly authorise the worker to widen that cfg — without it the five
#    red ids below cannot go green reliably no matter how correct the
#    per-scope tab model is.
#
# 8. §3b's "same scroll position as before the switch" is not asserted. The
#    round-trip test opens three tabs in an 82-column strip, where nothing is
#    scrolled, and the contract pins no rendered signal for a *restored* strip
#    scroll offset beyond §4's `‹`/`›` affordances — which are #2283's slice
#    and whose own mock the #2283 author already flagged (finding 4) as
#    contradicting §2b's label width. Inventing an observable for it would
#    have meant inventing a width. Flagged as a `TODO(test-author)` in the
#    slice.
#
# 9. §2f's scroll half is likewise not re-asserted for the Pipeline scope.
#    #2284's own AC says "reveals its row in the Pipeline sidebar, not the
#    Board's", and the contract pins the scroll requirement only for the Board
#    (§2f, five issues on a short viewport). This slice asserts the per-scope
#    SELECTION (`▸ #201` inside the Pipeline sidebar's columns 3–37, plus the
#    Board's own `▸ #103` surviving a Pipeline-side activation) and leaves the
#    scroll half to #2282's slice, which owns §2f. Also a `TODO(test-author)`.
#
# Also worth knowing, not a contract problem: the Pipeline sidebar nests
# tracked issues under state -> repo -> milestone nodes whose innermost node is
# COLLAPSED by default, and renders rows as `#201  Add retry backoffwork`
# (two spaces, title truncated to the 35-column sidebar, stage badge butted
# against it) — nothing like the mocks' `#201 Add retry backoff to fetch`. The
# slice therefore targets Pipeline rows by their `#<N>` tag restricted to the
# sidebar columns (§0), never by a full row string, and expands that group as a
# labelled precondition. The fixture also gives #101–#103 an untracked label
# and #201–#203 the tracked `coord` one: the Board sidebar lists all six (it
# does not filter by label) while the Pipeline lists only the 200s, which is
# what makes the mocks' 100s/200s ranges disjoint in a single seeded board.

