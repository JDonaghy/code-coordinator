name: Release (wheel)

# #1242 (PKG-6): ONE `v*` tag produces ONE GitHub Release carrying the whole
# system at one version — the PyPI wheel (with the `[server]` extra
# declared) and generated release notes.
#
# #2898 (phase 3 of #2894): "the whole system" no longer includes coord-tui,
# for the same reason #2009 removed the phone webapp — it is its own repo
# now, with its own `v*` tag namespace and its own Releases. This workflow
# used to call `.github/workflows/release-tui.yml` as a reusable workflow
# (`build-tui`) and gate `release` on its binaries; both are gone, and
# `verify-assets` no longer looks for `coord-tui-*` at all. That is the
# point of criterion 1: tagging `v*` HERE must produce a wheel and no
# coord-tui binaries, and must not fail for their absence.
#
# The tui half now lives in coord-tui's repo, staged in this tree at
# `tui/.github/workflows/release-tui.yml` until the #2894 move story carries
# it over. It fires on its own `v*` push and creates its own Release. One
# tag cannot stamp two repos, so the two version lines are independent by
# construction: coord `v0.5.x` alongside coord-tui `v0.2.y` is correct, and
# `coord tui update` / `coord release verify` are taught that in
# `coord/tui_release.py` and `coord/release_propagate.py`.
#
# #2009 (epic #2002): "the whole system" no longer includes the phone webapp.
# It used to: `build-wheel` ran `npm ci && npm run build` in
# `coord/dashboard/webapp/` and MANIFEST.in force-included the resulting
# `dist/` into the wheel (#758), so `pip install code-coordinator` shipped a
# servable bundle. That source now lives in the `coord-web` repo, so there
# is nothing here to build and the wheel carries no bundle — `verify-assets`
# is passed `--no-webapp` to assert that deliberately rather than by
# accident. A built bundle reaches a daemon host the way
# docs/ADR_COORD_WEB_DIST.md (#2004) settled: `coord-web-dist-build.sh` on
# its own ~10-minute timer publishes `~/coord-web-dist`, which `coord web
# --dist` serves. That path is decoupled from this workflow ON PURPOSE — a
# webapp fix must not wait for a PyPI release — so a wheel with no bundle is
# the intended steady state, not a regression. `coord web` with no bundle
# anywhere says so loudly (a startup warning, an in-page banner, and an
# `X-Coord-Webapp-Bundle: missing` response header) instead of silently
# serving the legacy single-file dashboard.
#
# What this replaced, and why it mattered:
#
#   Two independent workflows both fired on `v*` and both called
#   softprops/action-gh-release for the same tag. That action upserts by
#   `tag_name`, so whichever run's step landed first *created* the Release
#   and the other merely appended to it. This workflow was the one asking
#   for `generate_release_notes: true`, so whether the release even had
#   notes depended on a race between two runs — and neither workflow
#   attached the wheel, so the "release" a third party could download was
#   binaries only, with the actual Python package reachable solely from
#   PyPI.
#
#   The fix made release-tui.yml a *reusable* workflow this one called, so
#   both halves were jobs of a single run. Post-#2898 the two workflows are
#   in different repos entirely, which removes the shared-Release race at the
#   root: `release`, at the bottom, is still the only job here that creates a
#   GitHub Release, and it is now the only release-creating step in this repo
#   full stop.
#
# Version single-sourcing (#1238, PKG-2): nothing here hardcodes a version.
# The wheel's comes from setuptools-scm reading the tag, and `build-wheel`'s
# `scripts/verify_release_wheel.py` step is the gate that it took.
#
# Release muscle-memory: push a `vX.Y.Z` tag. Do NOT commit a version bump —
# there is no version literal left to bump.
#
# #2035: this workflow is now ALSO callable (`workflow_call`), and that is how
# the automated path reaches it. GitHub deliberately does not start workflows
# from events created with the default `GITHUB_TOKEN` (the recursion guard),
# so a `v*` tag pushed by auto-release.yml could never trigger the `push`
# entry below — it tagged v0.5.2, published nothing, and reported success.
# Calling this workflow directly removes the token class from the problem
# entirely while keeping ONE code path for "how a release happens": the
# manual `git tag` push and the merge-triggered release run the same jobs.

on:
  push:
    tags: ["v*"]
  # The automated entrypoint (#2035). auto-release.yml pushes the tag, then
  # calls this with that tag rather than hoping a `push` event fires.
  workflow_call:
    inputs:
      tag:
        description: >-
          The release tag to publish, e.g. `v0.5.2`. It must already exist on
          the remote — every job checks out `refs/tags/<tag>` so the build is
          a function of the tag alone, not of wherever `main` happens to have
          moved since the caller tagged it.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: >-
          Dry-run version tag. Builds the wheel, verifies it is stamped with
          this version and that the complete asset set is present — then
          STOPS. No PyPI
          upload, no GitHub Release, no tag pushed. This is how you validate
          a change to this workflow, since a real run publishes immutably to
          PyPI. Must be PEP 440-parseable once the leading `v` is stripped
          (so `v0.0.0`, not `v0.0.0-dryrun`) — the wheel half is checked
          against it by scripts/verify_release_wheel.py.
        required: true
        default: v0.0.0

# Least privilege by default; only the `release` job writes to the repo.
permissions:
  contents: read

jobs:
  # Resolve "what version is this run building, and is it for real?" exactly
  # once, so every downstream job reads one value instead of each
  # re-deriving it from the event.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      # The git ref every job in this run checks out. Under `workflow_call`
      # (#2035) `github.ref` is the *caller's* ref — `main` — so a checkout
      # that trusted the default would build whatever landed on main after
      # the caller cut the tag, and stamp it with the tag's version. Pinning
      # `refs/tags/<tag>` makes the build a function of the tag in every
      # mode, which is the property #1238's tag-is-the-version rests on.
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - id: resolve
        shell: bash
        # Via `env:` rather than spliced into the script — `dry_run_tag` is
        # workflow_dispatch input text, and interpolating it directly into
        # `run:` would splice it into (and execute it as) bash.
        #
        # Precedence: a `workflow_call` tag wins (the automated path), then a
        # dry-run's dispatch tag, then the ref this ran against (a real `v*`
        # tag push). Only one is ever non-empty — `inputs.tag` is unset under
        # push/dispatch, and `github.event.inputs` is null under
        # workflow_call.
        env:
          CALL_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.inputs.dry_run_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$CALL_TAG" ]; then
            tag="$CALL_TAG"
            dry_run=false
          elif [ -n "$DISPATCH_TAG" ]; then
            tag="$DISPATCH_TAG"
            dry_run=true
          else
            tag="$REF_NAME"
            dry_run=false
          fi
          # A dry run is dispatched against a *branch*, so there is no tag to
          # check out; it builds the ref it was dispatched against (and
          # `build-wheel` stamps a throwaway local tag on it).
          if [ "$dry_run" = "true" ]; then
            ref=""
          else
            ref="refs/tags/$tag"
          fi
          echo "Building $tag (dry_run=$dry_run, ref=${ref:-<default>})"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # #1471: main is a protected branch, so `git push origin main` can be
  # rejected while a subsequent `git push origin vX.Y.Z` still succeeds (they
  # are independent refs). Refuse to publish from a tag whose commit never
  # actually landed on main — PyPI releases are immutable, so failing here is
  # far cheaper than a bad publish. Every build job in this run gates on this
  # one. (#2898: the coord-tui build is gone from this workflow entirely, and
  # carries its own copy of this check again now that its own repo's
  # release-tui.yml is triggered by its own tag push.)
  #
  # Skipped for dry runs, which build whatever ref they were dispatched
  # against and never publish anything.
  verify-tag:
    needs: [plan]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    outputs:
      # Does THIS tag's release range ship PyPI wheel content? (#2102)
      # #2898: `tui/` is no longer a shipping prefix in this repo at all
      # (scripts/next_release_tag.py) — it has its own channel — so a
      # hand-pushed tag over a non-wheel range still cuts a tag and a GitHub
      # Release here, and publish-pypi below skips the upload for it.
      wheel: ${{ steps.wheel.outputs.wheel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Needed for the wheel-decision step below: it lists every
          # existing `vX.Y.Z` tag to find the one this range released
          # *from*. build-wheel needs the same thing for setuptools-scm and
          # sets it for the same reason.
          fetch-tags: true
          ref: ${{ needs.plan.outputs.ref }}
      - name: Verify tag is on main
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin main
          # HEAD, not `github.sha`: under `workflow_call` (#2035) `github.sha`
          # is the caller's commit (main's tip), not the tagged commit, so
          # reading it here would check the wrong object — and would pass
          # trivially, since main's tip is always an ancestor of main.
          tagged_commit="$(git rev-parse HEAD)"
          echo "Tag $TAG -> $tagged_commit"
          if ! git merge-base --is-ancestor "$tagged_commit" origin/main; then
            echo "::error::Tag $TAG points at commit $tagged_commit, which is not an ancestor of origin/main. This tag was likely pushed from a local commit that main's branch protection rejected. Refusing to publish — merge the commit to main first, then re-tag it."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # #2102: computed HERE, from the tag and git history alone, rather
      # than threaded down from auto-release.yml's merge-time `decide` step
      # — that step doesn't run at all on the `already_released_tag`
      # recovery path or a hand-pushed tag, and this must give the same
      # answer on every entrypoint. See next_release_tag.py's
      # `--wheel-for-tag` and its module docstring.
      - name: Decide whether this range ships a PyPI wheel
        id: wheel
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python scripts/next_release_tag.py --wheel-for-tag "$TAG"

  build-wheel:
    needs: [plan, verify-tag]
    # `always()`: verify-tag is *skipped* (not failed) on a dry run, and a
    # skipped dependency would otherwise skip this job too.
    if: ${{ always() && needs.plan.result == 'success' && (needs.verify-tag.result == 'success' || needs.verify-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools-scm derives the version from the nearest reachable git
          # tag (#1238) and *falls back* to `X.Y.Z.devN+g<sha>` rather than
          # failing when it can't see one — which is right for a dev checkout
          # and catastrophic for a PyPI upload. Full history + tags, never a
          # shallow clone, so the tag is always reachable.
          fetch-depth: 0
          fetch-tags: true
          # Empty on a dry run (see `plan`), which means "the default ref".
          ref: ${{ needs.plan.outputs.ref }}

      # A dry run is dispatched against a branch, not a tag, so there is no
      # release tag for setuptools-scm to find. A throwaway *local* tag on
      # HEAD gives the dry run the same code path a real release takes
      # (nothing is pushed; this checkout is discarded with the runner).
      - name: Stamp a throwaway local tag (dry run only)
        if: needs.plan.outputs.dry_run == 'true'
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: git tag -f "$TAG"

      - name: Show the version setuptools-scm will resolve
        run: git describe --tags --dirty --always

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `packaging` for scripts/verify_release_wheel.py's PEP 440 comparison.
      - run: pip install build packaging

      # #2009: no Node, and no `npm ci && npm run build` step, because there
      # is no `coord/dashboard/webapp/` to build — see this file's header.
      - run: python -m build

      # `--no-webapp` is the assertion, not a waiver: it says "this wheel is
      # expected to carry no coord/dashboard/webapp/dist/, and every OTHER
      # check still has to pass". Dropping the flag would fail the release on
      # a missing bundle; dropping the whole step would stop checking the
      # version stamp and the `[server]` extra too.
      - name: Verify the wheel is stamped with the tag (+ [server] extra)
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python scripts/verify_release_wheel.py --tag "$TAG" --dist dist --no-webapp

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  # The acceptance gate, and the reason a dry run is worth running: prove the
  # asset set is complete BEFORE anything irreversible happens. Runs
  # identically in both modes.
  verify-assets:
    # `plan` is already a transitive dependency, but `needs.plan.outputs` is
    # only readable from a *direct* `needs` entry.
    needs: [plan, build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and check the release asset set
        shell: bash
        # #2898: `coord-tui-*` is gone from BOTH the collect glob and the
        # completeness loop below, and its absence must not be treated as an
        # incomplete release — that is criterion 1 of #2898. coord-tui's
        # binaries are published by coord-tui's own repo's release-tui.yml
        # onto ITS Release, which is what `coord tui update` now resolves
        # (coord/tui_release.py's DEFAULT_REPO). Re-adding a `coord-tui-*`
        # check here would fail every release in this repo forever, since
        # nothing in this run builds one any more.
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

          missing=""
          # One wheel + one sdist. scripts/verify_release_wheel.py already
          # proved they carry the tag version; this proves they got here.
          compgen -G 'release-assets/*.whl' > /dev/null || missing="$missing wheel"
          compgen -G 'release-assets/*.tar.gz' > /dev/null || missing="$missing sdist"

          if [ -n "$missing" ]; then
            echo "::error::Release ${{ needs.plan.outputs.tag }} would be incomplete — missing:$missing"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  # #2102: skipped for a range with no wheel content. Nothing changed in the wheel this
  # run built (it's still built and still attached to the GitHub Release
  # below, byte-identical to its predecessor apart from the version string),
  # so there is nothing to publish — such a merge must not mint a PyPI
  # upload, and `verify-tag`'s `wheel` output (computed from the tag alone,
  # independent of how it was triggered) is what decides. Failing OPEN: an
  # empty/unset output (a value neither 'true' nor 'false') still publishes —
  # see next_release_tag.py's `ships_wheel` for the same fail-open reasoning.
  publish-pypi:
    needs: [plan, verify-tag, verify-assets]
    if: needs.plan.outputs.dry_run != 'true' && needs.verify-tag.outputs.wheel != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # #2035: make the release path re-runnable. A run that uploaded the
          # wheel and then failed downstream (or was cancelled) must be
          # re-runnable to completion; without this, the retry dies on PyPI's
          # immutability and the release stays half-done forever. This does
          # not weaken the gate — `verify-published` below independently
          # proves the version really is servable, so "the upload was a
          # no-op" can no longer be mistaken for "the release happened".
          skip-existing: true

  # The single owner of the GitHub Release. Runs only once every other half
  # has succeeded, so a Release never exists advertising a wheel that failed
  # to upload or binaries that failed to build. Skipped entirely on a dry
  # run — `verify-assets` above already proved what it would have published.
  #
  # `always()` + the explicit `publish-pypi` result check (#2102): a
  # wheel-less range SKIPS publish-pypi above rather than failing it, and a
  # skipped `needs` job would otherwise skip every job downstream of it by
  # default — which would leave such ranges cutting no GitHub Release
  # at all, the opposite of what this issue asks for. `success` still gates
  # normally for a mixed range that actually published.
  release:
    needs: [plan, verify-assets, publish-pypi]
    if: ${{ always() && needs.plan.outputs.dry_run != 'true' && needs.verify-assets.result == 'success' && (needs.publish-pypi.result == 'success' || needs.publish-pypi.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # `needs.plan.outputs.tag`, not `github.ref_name`: under
          # `workflow_call` (#2035) the latter is the caller's branch, which
          # would cut a Release named `main`.
          tag_name: ${{ needs.plan.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*

  # ────────────────────────────────────────────────────────────────────────
  # #2035: THE POST-CONDITION. Nothing above proves the release exists.
  #
  # Every job so far reports success when its own steps exit zero, which is
  # not the same claim as "a user can install this version". The first fully
  # automatic release (v0.5.2, 2026-08-09) tagged, published nothing, and
  # went green — and green is worse than red here, because every deploy lane
  # then targets a version that does not exist while `coord release verify`
  # sees the fleet uniformly agreeing on the old one and calls that health.
  #
  # This job is what makes that state unreachable: poll until the version is
  # actually servable, then fail loudly and specifically if it never is. It
  # runs for BOTH entrypoints — a hand-pushed tag and the merge-triggered
  # call — because the defect it guards is a property of the release path,
  # not of any one trigger.
  #
  # #2102: for a range with no wheel content this no longer means "servable from
  # PyPI" — publish-pypi deliberately skipped, so polling the index would
  # wait 600s and then fail loudly for a wheel that was never supposed to
  # exist. The post-condition instead becomes "the GitHub Release exists
  # with its assets" (`--skip-pypi`), which is #2035's actual invariant —
  # the release path must not be able to report success while having
  # published nothing it was supposed to. `always()` + the explicit
  # `release` check, same reasoning as the `release` job above: publish-pypi
  # is SKIPPED (not failed) for that range, and a skipped `needs` job would
  # otherwise skip this post-condition too — the one job in this workflow
  # that must never silently not run on a real release.
  # ────────────────────────────────────────────────────────────────────────
  verify-published:
    needs: [plan, verify-tag, publish-pypi, release]
    if: ${{ always() && needs.plan.outputs.dry_run != 'true' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No `pip install`: scripts/verify_release_published.py and the
      # coord.health.pypi index parser it reuses are pure stdlib on purpose,
      # so the check that proves the release exists cannot itself be broken
      # by a dependency resolution failure.
      #
      # Known edge: re-pushing a tag from before this landed checks out a
      # tree with no such script, and this job fails. That is the right way
      # round — a loud failure on an unsupported path, not a silent green.
      - name: Prove the release actually exists
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHEEL: ${{ needs.verify-tag.outputs.wheel }}
        run: |
          set -euo pipefail
          args=(--tag "$TAG" --github-repo "${{ github.repository }}" --timeout 600 --interval 15)
          if [ "$WHEEL" = "false" ]; then
            echo "::notice::$TAG shipped no PyPI wheel (no wheel content in range, #2102) — checking the GitHub Release only."
            args+=(--skip-pypi)
          fi
          python scripts/verify_release_published.py "${args[@]}"
